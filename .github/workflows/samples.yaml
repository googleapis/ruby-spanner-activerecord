name: samples

permissions:
  contents: read

on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        ar: ["7.1", "7.2", "8.0"]
        # Exclude combinations that are not supported.
        exclude:
          - ruby: "3.4"
            ar: "7.1"
          - ruby: "3.4"
            ar: "7.2"
          - ruby: "4.0"
            ar: "7.1"
          - ruby: "4.0"
            ar: "7.2"
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.ar }}.gemfile
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        bundler-cache: false
        ruby-version: ${{ matrix.ruby }}
    - name: Install dependencies
      run: bundle install
    - name: Run samples
      run: bundle exec rake all
      working-directory: examples/snippets
